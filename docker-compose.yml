# Orquestación de desarrollo: aplicación FastAPI + PostgreSQL.
# El servicio Redis (para colas Celery/arq y caché) se incluye comentado como
# ruta de escalado documentada; ver README.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: prospect
      POSTGRES_DB: prospection
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect -d prospection"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Sobrescribe el host de la BD para apuntar al servicio "db".
      DATABASE_URL: postgresql+psycopg://prospect:prospect@db:5432/prospection
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- Ruta de escalado (fase futura) -------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #
  # worker:
